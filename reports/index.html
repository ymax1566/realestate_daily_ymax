<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EZPage Reports</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f0e6;
      color: #14202b;
    }
    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 40px 24px 64px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 42px;
    }
    .deck {
      margin: 0 0 28px;
      color: #536270;
      line-height: 1.6;
    }
    .grid {
      display: grid;
      gap: 18px;
    }
    .card {
      background: rgba(255,255,255,0.88);
      border: 1px solid rgba(20,32,43,0.08);
      border-radius: 18px;
      padding: 22px 24px;
      box-shadow: 0 14px 28px rgba(20,32,43,0.08);
    }
    .eyebrow {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .18em;
      color: #7b5b2e;
      margin-bottom: 10px;
    }
    .card h2 {
      margin: 0 0 6px;
      font-size: 26px;
    }
    .card h2 a {
      color: inherit;
      text-decoration: none;
    }
    .card p {
      margin: 0;
      color: #536270;
    }
    .links {
      display: flex;
      gap: 16px;
      margin-top: 14px;
    }
    .links a {
      color: #7b5b2e;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1>EZPage Reports</h1>
    <p class="deck">这里收录每日自动生成的房产日报与 PDF 版本。</p>
    <section class="grid">
      
            <article class="card">
              <div class="eyebrow">Daily Report</div>
              <h2><a href="https://ymax1566.github.io/realestate_daily_ymax/reports/balwyn-vic/">Balwyn VIC 房产日报</a></h2>
              <p>更新于 2026-03-20 18:00</p>
              <div class="links">
                <a href="https://ymax1566.github.io/realestate_daily_ymax/reports/balwyn-vic/">打开 HTML</a>
                <a href="https://ymax1566.github.io/realestate_daily_ymax/reports/balwyn-vic/balwyn-vic-daily.pdf">下载 PDF</a>
              </div>
            </article>
            
    </section>
  </main>
</body>
</html>
